<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>照準の箱 | 山の配置表</title>
<!-- Direct build reference lock: supplied geometric setup brief; Refero craft-details
for labeled finite inputs and keyboard controls, typography for tabular numbers.
Printed sheets are white, black, 20px+ body, one summit crosshair per page.
Mountain silhouettes are schematic icons, not terrain or surveyed skyline data. -->
<style>
:root{font-family:"Noto Sans JP","Yu Gothic UI",Meiryo,sans-serif;font-size:20px;color:#152523;background:#e7ece9}*{box-sizing:border-box}body{margin:0;line-height:1.5}header{max-width:1120px;margin:auto;padding:24px;display:flex;justify-content:space-between;gap:24px;align-items:center}a{color:#205d4b}h1{font-size:32px;margin:0 0 8px}h2{font-size:28px;margin:0 0 12px}.controls{max-width:1120px;margin:0 auto 24px;padding:0 24px;display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end}.controls label{display:block}input,button{font:inherit;border:1px solid #819c91;border-radius:8px;background:#fff;color:#152523;padding:8px 12px;min-height:48px}input{display:block;width:140px}button{cursor:pointer}button.primary{background:#163e31;color:white}button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #0f8364;outline-offset:3px}.sheet{background:white;width:min(1120px,calc(100% - 32px));margin:0 auto 24px;padding:32px;border:1px solid #b6c9c0}.subtitle{color:#466357;font-size:20px;margin:8px 0 16px}.setup{display:grid;grid-template-columns:320px 1fr;gap:24px;align-items:center}.floor{width:100%;height:240px}.setup p{margin:8px 0}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;margin:16px 0;font-size:20px}th,td{text-align:left;padding:12px 8px;border-bottom:1px solid #c1d2c8;white-space:nowrap}th{background:#edf3ef;font-weight:600}td:not(:first-child){font-variant-numeric:tabular-nums}small{font-size:16px}.note{border:1px solid #819c91;padding:12px 16px;margin-top:16px}.formula{font-size:16px;color:#466357}.aim{position:relative;text-align:center}.aim .target-drawing{display:block;width:100%;height:280px}.aim h2{font-size:48px;margin:8px 0}.aim .label{font-size:20px;text-align:left;display:flex;justify-content:space-between;gap:16px}.metrics{display:flex;justify-content:space-around;gap:16px;margin:16px 0}.metrics strong{font-size:36px;display:block;white-space:nowrap}.metrics span{font-size:20px}.mount{font-size:24px;margin:0}.warning{color:#9f2727}.print-caption{font-size:16px}.sheet-number{color:#466357;letter-spacing:.06em}.preview .sheet{width:273mm;min-width:273mm;height:186mm;padding:8mm;overflow:hidden}.preview .controls,.preview header{min-width:273mm}.preview .floor{height:180px}.preview h1{font-size:28px}.preview table{margin:8px 0;font-size:18px}.preview th,.preview td{padding:8px}.preview .note{margin-top:8px;padding:8px;font-size:18px}.preview .aim .target-drawing{height:78mm}.preview .aim h2{font-size:40px}.preview .metrics{margin:8px 0}.preview .subtitle{margin:4px 0 8px}.preview .setup p{margin:4px 0}.preview .print-caption{margin:4px 0}.preview .formula{margin:4px 0}.controls p{margin:0}#error{flex-basis:100%;margin:0}.screenonly{display:initial}@media(max-width:800px){header{display:block}.setup{grid-template-columns:1fr}.floor{max-width:400px}.sheet{padding:20px}.metrics{flex-wrap:wrap}.metrics strong{font-size:28px}.aim h2{font-size:36px}.aim .target-drawing{height:220px}}@page{size:A4 landscape;margin:12mm}@media print{body{background:white}header,.controls,.screenonly{display:none!important}.sheet{width:273mm;height:186mm;margin:0;padding:8mm;border:0;break-after:page;break-inside:avoid;overflow:hidden}.sheet:last-child{break-after:auto}.setup{grid-template-columns:320px 1fr}.floor{height:180px}h1{font-size:28px}.subtitle{margin:4px 0 8px}table{margin:8px 0;font-size:18px}th,td{padding:8px}.tablewrap{overflow:visible}.note{margin-top:8px;padding:8px;font-size:18px}.aim .target-drawing{height:78mm}.aim h2{font-size:40px}.metrics{margin:8px 0;flex-wrap:nowrap}.metrics strong{font-size:36px}.setup p{margin:4px 0}.print-caption,.formula{margin:4px 0}a{color:inherit;text-decoration:none}}
</style>
<header><div><h1>山の配置表と山頂マーク</h1><p class="subtitle">Mt Moranを前に置く、室内デモの設営用</p></div><a href="guide.html#step-9">組み立てガイドへ</a></header>
<form class="controls" id="controls"><label>半径（m）<input id="radius" type="number" min="0.5" max="10" step="0.1" value="2.5" required></label><label>照準の高さ（m）<input id="height" type="number" min="0.5" max="2.5" step="0.01" value="1.3" required></label><button class="primary" type="submit">配置を更新</button><button id="preview" type="button">印刷用レイアウト</button><button id="print" type="button">印刷する</button><p id="error" class="warning" role="status"></p></form>
<main id="sheets"></main>
<script>
'use strict';
const scene={schema_version:1,demo:true,source:'phone_state.json',source_stage:'lock_3',reference_peak_id:'peak_0',target_order:['peak_1','peak_0','peak_2'],peaks:[{id:'peak_1',name:'Pk 3666',bearing_true:143.715,elev_deg:14.8},{id:'peak_0',name:'Mt Moran',bearing_true:126.166,elev_deg:14.654},{id:'peak_2',name:'Pk 3388',bearing_true:159.364,elev_deg:10.624}]};
const ref=scene.peaks.find(p=>p.id===scene.reference_peak_id);const rad=d=>d*Math.PI/180;const num=(n,d=2)=>(Math.abs(n)<1e-9?0:n).toFixed(d);const names=['①','②','③'];let rows=[],radius=2.5,height=1.3;
function calculate(r,h){return scene.target_order.map((id,i)=>{const p=scene.peaks.find(p=>p.id===id),delta=(p.bearing_true-ref.bearing_true+360)%360;return {...p,index:i,delta,front:r*Math.cos(rad(delta)),right:r*Math.sin(rad(delta)),up:r*Math.tan(rad(p.elev_deg)),total:h+r*Math.tan(rad(p.elev_deg))};});}
function floor(){let svg='<svg class="floor" viewBox="0 0 340 240" role="img" aria-label="床を上から見た配置。立ち位置から前にMt Moran、その右にPk 3666とPk 3388"><path d="M50 196 A170 170 0 0 1 220 26" fill="none" stroke="#a2b7aa" stroke-dasharray="5 5"/><path d="M50 220V10m-20 186h290" stroke="#819c91" stroke-width="1"/><text x="15" y="18" font-size="18">前</text><text x="285" y="222" font-size="18">右</text><path d="m40 186 20 20m0-20-20 20" stroke="#173e31" stroke-width="4"/><text x="60" y="227" font-size="18">立ち位置 ×</text>';
rows.forEach(p=>{const x=50+p.right/radius*170,y=196-p.front/radius*170;svg+='<path d="M50 196L'+x+' '+y+'" stroke="#5d8774" stroke-width="2"/><circle cx="'+x+'" cy="'+y+'" r="16" fill="white" stroke="#163e31" stroke-width="2"/><text x="'+x+'" y="'+(y+7)+'" text-anchor="middle" font-size="24">'+names[p.index]+'</text>';});return svg+'<text x="150" y="166" font-size="20">半径 '+num(radius,1)+' m</text></svg>';}
function position(n,positive,negative){return (n>=-1e-9?positive:negative)+' '+num(Math.abs(n))+' m';}
function draw(){rows=calculate(radius,height);let html='<section class="sheet overview"><div class="sheet-number">設営シート · 室内の模擬場面</div><h1>立ち位置と3つの山</h1><p class="subtitle">まずMt Moranで方位合わせ。その後は①、②、③の順にLock。</p><div class="setup">'+floor()+'<div><p>① 床に×を付け、Mt Moranの方向を前にする。</p><p>② 表の前と右の距離を測り、山頂マークを置く。</p><p>③ 床からの高さは、紙の<strong>十字の中心</strong>に合わせる。</p><p>半径 <strong>'+num(radius,1)+' m</strong> · 照準の高さ <strong>'+num(height)+' m</strong></p></div></div><div class="tablewrap"><table><thead><tr><th>狙う山</th><th>右回り</th><th>見上げ</th><th>前</th><th>右</th><th>上</th><th>床から</th></tr></thead><tbody>'+rows.map(p=>'<tr><td>'+names[p.index]+' '+p.name+'</td><td>'+num(p.delta,3)+'°</td><td>'+num(p.elev_deg,3)+'°</td><td>'+num(p.front)+' m</td><td>'+num(p.right)+' m</td><td>'+num(p.up)+' m</td><td>'+num(p.total)+' m</td></tr>').join('')+'</tbody></table></div><p class="formula">前 = 半径 × cos(右回り角度)、右 = 半径 × sin(右回り角度)、上 = 半径 × tan(見上げ角度)。負の値は後ろか左。</p><div class="note">phone_state.jsonのlock_3の推定地点で固定した配置。元の模擬観測列とは角度が異なる。Pkの名前は標高による仮ラベル。地形の出典はUSGS 3DEPとOpenTopography。</div><p class="print-caption">A4横、倍率100%、余白12 mmが目安。実際の高さと距離はメジャーで測る。印刷物の縮尺を距離測定に使わない。</p></section>';
for(const p of rows){html+='<section class="sheet aim"><div class="label"><span>'+names[p.index]+' Lock '+(p.index+1)+'</span><span>'+(p.id===ref.id?'長押しの方位合わせにも使用':'短押しで観測')+'</span></div><h2>'+p.name+'</h2><svg class="target-drawing" viewBox="0 0 960 280" role="img" aria-label="山頂を示す十字。図の輪郭は模式図"><path d="M90 260L240 160 320 210 480 80 550 155 620 125 840 260Z" fill="#edf3ef" stroke="#183d31" stroke-width="3"/><path d="m422 127 58-47 57 62-55-21z" fill="white" stroke="#183d31"/><circle cx="480" cy="80" r="30" fill="white" stroke="#111" stroke-width="3"/><path d="M480 32v96m-48-48h96" stroke="#111" stroke-width="3"/><circle cx="480" cy="80" r="4" fill="#111"/><text x="544" y="69" font-size="24">この十字の中心を狙う</text><text x="544" y="102" font-size="24">床から '+num(p.total)+' m</text></svg><p class="mount">'+position(p.front,'前','後ろ')+' · '+position(p.right,'右','左')+' · 照準から上 '+num(p.up)+' m</p><div class="metrics"><div><span>Mt Moranから右回り</span><strong>'+num(p.delta,3)+'°</strong></div><div><span>見上げる角度</span><strong>'+num(p.elev_deg,3)+'°</strong></div><div><span>真北からの方位</span><strong>'+num(p.bearing_true,3)+'°</strong></div></div><p class="print-caption">半径 '+num(radius,1)+' m、照準の高さ '+num(height)+' m。輪郭は識別用の模式図で、実際の山の稜線ではない。</p></section>';}
document.getElementById('sheets').innerHTML=html;}
document.getElementById('controls').addEventListener('submit',e=>{e.preventDefault();const r=Number(document.getElementById('radius').value),h=Number(document.getElementById('height').value);if(!Number.isFinite(r)||!Number.isFinite(h)||r<.5||r>10||h<.5||h>2.5){document.getElementById('error').textContent='半径は0.5〜10 m、高さは0.5〜2.5 mで入力してね。';return;}radius=r;height=h;document.getElementById('error').textContent='配置を更新した。印刷前に会場の高さと幅を確認してね。';draw();});
document.getElementById('preview').addEventListener('click',()=>{const on=document.body.classList.toggle('preview');document.getElementById('preview').textContent=on?'通常表示に戻す':'印刷用レイアウト';});document.getElementById('print').addEventListener('click',()=>window.print());draw();
</script></html>
